<text x='35' y='962' font-size='21'>Notación UML simplificada: componentes, artefacto de datos y dependencias discontinuas consumidor → proveedor.</text>
<text x='35' y='994' font-size='21'>C1–C14: relaciones explicadas en Diagrama_Componentes_Galactum.md; las respuestas pueden circular en sentido inverso.</text>
<text x='35' y='1026' font-size='21'>Catálogos compartidos en cliente y servidor; se omiten dependencias auxiliares. Los módulos no son microservicios.</text>
<text x='35' y='1058' font-size='21'>Persistencia dentro de game_server.gd. Fuentes: S5–S9. Despliegue Docker documentado por separado.</text>
